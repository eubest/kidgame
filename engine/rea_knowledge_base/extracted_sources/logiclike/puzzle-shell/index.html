<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Puzzle Shell</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
      #stage { position: fixed; inset: 0; overflow: hidden; background: #fff; }
      /* The incoming iframe sits settled behind the outgoing one; revealing it
         is a plain opacity fade of the outgoing frame. */
      .frame {
        position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
        background: #fff; transition: opacity 300ms ease;
      }
      .fade-out { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="shell.js"></script>
  </body>
</html>
